app = 'bonjovidingus'
primary_region = 'arn'

[build]
[env]
PORT = "3001"
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
